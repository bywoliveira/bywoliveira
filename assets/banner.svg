<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
<title id="t">Bianca Moreira de Oliveira</title>
<desc id="d">Banner azul com estrelas piscando e o nome Bianca Moreira</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#040a22"/>
    <stop offset="0.55" stop-color="#0b1f5c"/>
    <stop offset="1" stop-color="#1d4ed8"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#bfdbfe"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.95"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<style>
  .tw   { animation: tw 3s ease-in-out infinite; }
  .sp   { animation: sp 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .float{ animation: float 6s ease-in-out infinite; }
  .shoot{ animation: shoot 7s ease-in infinite; opacity: 0; }
  @keyframes tw   { 0%,100% { opacity:.15 } 50% { opacity:1 } }
  @keyframes sp   { 0%,100% { opacity:.25; transform: scale(.55) } 50% { opacity:1; transform: scale(1.15) } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes float{ 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes shoot{ 0% { opacity:0; transform: translate(0,0) } 4% { opacity:1 } 18% { opacity:0; transform: translate(420px,210px) } 100% { opacity:0; transform: translate(420px,210px) } }
  @media (prefers-reduced-motion: reduce) { .tw,.sp,.spin,.float,.shoot { animation: none; opacity:.8 } }
</style>
